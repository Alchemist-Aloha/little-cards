<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="zebra-title">
  <title id="zebra-title">Zebra standing in profile</title>
  <style>
    svg { color-scheme: light dark; --coat: light-dark(#f4f0e8, #d6d2cb); --stripe: light-dark(#41464b, #30353b); --line: light-dark(#69645e, #77716b); --shade: light-dark(#d8d3cb, #b6b2ac); }
    .coat { fill: var(--coat); stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
    .stripe { fill: var(--stripe); }
    .detail { fill: none; stroke: var(--stripe); stroke-width: 1.3; stroke-linecap: round; }
  </style>
<g>
  <ellipse cx="100" cy="181" rx="62" ry="7.5" fill="#786b5e" opacity=".13"/>
  <defs>
    <clipPath id="zb-clip"><path d="M44 142 C34 132 32 112 42 100 C52 88 72 84 92 84 C112 84 128 88 136 96 C138 84 140 68 144 54 L168 60 C162 78 156 98 154 114 C154 132 144 142 124 144 C104 148 62 148 50 144 Z"/></clipPath>
    <clipPath id="zb-head"><path d="M142 46 C152 36 168 36 176 46 C184 56 182 70 172 78 C162 86 148 84 143 74 C138 65 138 54 142 46 Z"/></clipPath>
  </defs>
  <!-- tufted tail -->
  <path d="M46 112 C36 124 31 138 31 150" fill="none" stroke="var(--line)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M31 148 C25 152 24 160 27 167 C33 164 35 154 31 148 Z" fill="var(--stripe)"/>
  <!-- far legs, held back with the shade tone -->
  <path d="M70 128 c-2 14 -2 26 0 38 h13 c2 -10 2 -24 0 -38 z" fill="var(--shade)" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M136 128 c-2 14 -2 26 0 38 h13 c2 -10 2 -24 0 -38 z" fill="var(--shade)" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M70 164 h13 v4 q0 8 -6.5 8 q-6.5 0 -6.5 -8 z" fill="var(--stripe)" stroke="var(--line)" stroke-width="2"/>
  <path d="M136 164 h13 v4 q0 8 -6.5 8 q-6.5 0 -6.5 -8 z" fill="var(--stripe)" stroke="var(--line)" stroke-width="2"/>
  <g fill="var(--stripe)">
    <path d="M71 150 l11 1 v5 l-11 -1 z M72 160 l10 1 v5 l-10 -1 z"/>
    <path d="M137 150 l11 1 v5 l-11 -1 z M138 160 l10 1 v5 l-10 -1 z"/>
  </g>
<!-- near legs with bands and dark hooves -->
  <path d="M50 132 c-2 14 -2 26 0 34 h15 c2 -8 2 -20 0 -34 z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4"/>
  <path d="M118 132 c-2 14 -2 26 0 34 h15 c2 -8 2 -20 0 -34 z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4"/>
  <g fill="var(--stripe)">
    <path d="M51 141 l13 1 v5 l-13 -1 z M52 152 l12 1 v5 l-12 -1 z M53 163 l11 1 v5 l-11 -1 z"/>
    <path d="M119 141 l13 1 v5 l-13 -1 z M120 152 l12 1 v5 l-12 -1 z M121 163 l11 1 v5 l-11 -1 z"/>
  </g>
  <path d="M50 164 h15 v4 q0 8 -7.5 8 q-7.5 0 -7.5 -8 z" fill="var(--stripe)" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M118 164 h15 v4 q0 8 -7.5 8 q-7.5 0 -7.5 -8 z" fill="var(--stripe)" stroke="var(--line)" stroke-width="2.2"/>
  <!-- body and neck over the leg tops -->
  <path d="M44 142 C34 132 32 112 42 100 C52 88 72 84 92 84 C112 84 128 88 136 96 C138 84 140 68 144 54 L168 60 C162 78 156 98 154 114 C154 132 144 142 124 144 C104 148 62 148 50 144 Z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- bold stripes following the barrel and the neck -->
  <g clip-path="url(#zb-clip)" fill="var(--stripe)">
    <path d="M52 66 C50 96 47 128 43 176 L55 176 C58 128 60 96 63 66 Z"/>
    <path d="M70 66 C68 96 65 126 61 176 L71 176 C73 126 75 96 77 66 Z"/>
    <path d="M84 66 C82 100 79 132 75 176 L87 176 C89 132 91 100 93 66 Z"/>
    <path d="M98 66 C96 100 93 136 89 176 L98 176 C100 136 102 100 104 66 Z"/>
    <path d="M112 66 C110 100 107 140 103 176 L114 176 C116 140 118 100 121 66 Z"/>
    <path d="M128 70 C126 90 124 110 121 140 L130 140 C133 110 135 90 138 68 Z"/>
    <path d="M138 40 C134 62 132 80 130 100 L139 98 C141 78 143 60 147 40 Z"/>
    <path d="M152 42 C148 62 146 80 143 100 L151 98 C154 78 156 60 160 44 Z"/>
    <path d="M162 50 C158 66 156 78 154 92 L161 90 C164 76 166 62 168 52 Z"/>
    <path d="M143 92 C141 108 139 128 137 150 L147 148 C149 128 151 110 154 94 Z"/>
  </g>
<!-- head -->
  <path d="M142 46 C152 36 168 36 176 46 C184 56 182 70 172 78 C162 86 148 84 143 74 C138 65 138 54 142 46 Z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"/>
  <g clip-path="url(#zb-head)" fill="none" stroke="var(--stripe)" stroke-width="6" stroke-linecap="round">
    <path d="M143 50 Q149 54 144 68"/>
    <path d="M156 40 Q163 48 158 62"/>
  </g>
  <!-- ears -->
  <path d="M152 40 C150 30 155 24 161 27 C164 31 160 37 159 42 Z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4"/>
  <path d="M169 40 C170 31 175 26 180 30 C182 35 176 39 173 43 Z" fill="var(--coat)" stroke="var(--line)" stroke-width="2.4"/>
  <path d="M154 38 Q153 32 157 30" fill="none" stroke="var(--stripe)" stroke-width="3" stroke-linecap="round"/>
  <path d="M171 38 Q173 32 177 32" fill="none" stroke="var(--stripe)" stroke-width="3" stroke-linecap="round"/>
  <!-- upright mane on the back of the neck -->
  <g fill="var(--stripe)">
    <path d="M134 99 L137 89 L126 93 Z"/>
    <path d="M136 86 L139 76 L128 80 Z"/>
    <path d="M138 73 L141 63 L130 67 Z"/>
    <path d="M140 60 L143 50 L132 54 Z"/>
  </g>
  <!-- dark muzzle, eye, nostril and mouth -->
  <ellipse cx="172" cy="72" rx="12" ry="9" fill="var(--stripe)" stroke="var(--line)" stroke-width="2"/>
  <path d="M164 79 Q172 84 180 79" fill="none" stroke="var(--shade)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="155" cy="55" r="4.6" fill="var(--stripe)"/>
  <circle cx="156.6" cy="53.4" r="1.6" fill="#fffdf7"/>
  <ellipse cx="74" cy="106" rx="14" ry="7" fill="#fffdf7" opacity=".45"/>
  </g>
</svg>
